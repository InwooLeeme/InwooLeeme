<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title"><title id="title">MCP Assistant: LLM calls per command reduced from three to one, excluding tools</title><defs><radialGradient id="ambient" cx="85%" cy="0%" r="90%"><stop stop-color="#173f3d" stop-opacity=".8"/><stop offset="1" stop-color="#0b1314" stop-opacity="0"/></radialGradient><linearGradient id="edge"><stop stop-color="#80edb3"/><stop offset=".5" stop-color="#67dbe9"/><stop offset="1" stop-color="#b5a0ff"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#2c4947" opacity=".5"/></pattern></defs><style>.flow{stroke-dasharray:5 8;animation:flow 12s linear infinite}.cursor{animation:blink 1.8s steps(1) infinite}@keyframes flow{to{stroke-dashoffset:-130}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.flow,.cursor{animation:none}}</style><rect x="1" y="1" width="958" height="308" rx="16" fill="#0b1314" stroke="#2e4645"/><rect x="2" y="2" width="956" height="306" rx="15" fill="url(#ambient)"/><rect x="2" y="48" width="956" height="260" rx="15" fill="url(#grid)"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><path d="M1 48L959 48" fill="none" stroke="#2b4140" /><circle cx="25" cy="25" r="4.5" fill="#f27f7d"/><circle cx="44" cy="25" r="4.5" fill="#eac679"/><circle cx="63" cy="25" r="4.5" fill="#80edb3"/><text x="88" y="30" fill="#96aaa3" font-size="12" font-weight="400" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" >project-01 / mcp-assistant</text><text x="936" y="30" fill="#698c82" font-size="10" font-weight="400" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="end">PROJECT NOTES</text><text x="32" y="90" fill="#edf7f2" font-size="23" font-weight="700" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" >ONE INTENT. ONE PLAN.</text><text x="32" y="119" fill="#96aaa3" font-size="15" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" >의도 분석과 실행 계획을 하나의 LLM으로 통합</text><rect x="32" y="145" width="390" height="100" rx="10" fill="#142122" stroke="#36504c"/><text x="50" y="173" fill="#91a79e" font-size="11" font-weight="600" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" >BEFORE</text><rect x="53" y="189" width="96" height="32" rx="6" fill="#22302f" stroke="#40534a"/><text x="101" y="210" fill="#b7c8bf" font-size="13" font-weight="600" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle">LLM</text><rect x="169" y="189" width="96" height="32" rx="6" fill="#22302f" stroke="#40534a"/><text x="217" y="210" fill="#b7c8bf" font-size="13" font-weight="600" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle">LLM</text><rect x="285" y="189" width="96" height="32" rx="6" fill="#22302f" stroke="#40534a"/><text x="333" y="210" fill="#b7c8bf" font-size="13" font-weight="600" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle">LLM</text><path d="M149 205L169 205" fill="none" stroke="#6c8278" /><path d="M265 205L285 205" fill="none" stroke="#6c8278" /><text x="457" y="204" fill="#80edb3" font-size="28" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" >→</text><rect x="510" y="145" width="418" height="100" rx="10" fill="#102d26" stroke="#478c6c"/><text x="528" y="173" fill="#80edb3" font-size="11" font-weight="600" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" >AFTER</text><rect x="528" y="187" width="225" height="38" rx="6" fill="#1b4537" stroke="#599c7d"/><text x="641" y="211" fill="#dcfcec" font-size="14" font-weight="600" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle">INTENT + PLAN</text><path