<svg xmlns="http://www.w3.org/2000/svg" width="960" height="85" viewBox="0 0 960 85" role="img" aria-labelledby="title"><title id="title">Keep building. Keep solving.</title><defs><radialGradient id="ambient" cx="85%" cy="0%" r="90%"><stop stop-color="#173f3d" stop-opacity=".8"/><stop offset="1" stop-color="#0b1314" stop-opacity="0"/></radialGradient><linearGradient id="edge"><stop stop-color="#80edb3"/><stop offset=".5" stop-color="#67dbe9"/><stop offset="1" stop-color="#b5a0ff"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#2c4947" opacity=".5"/></pattern></defs><style>.flow{stroke-dasharray:5 8;animation:flow 12s linear infinite}.cursor{animation:blink 1.8s steps(1) infinite}@keyframes flow{to{stroke-dashoffset:-130}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.flow,.cursor{animation:none}}</style><rect x="1" y="1" width="958" height="83" rx="16" fill="#0b1314" stroke="#2e4645"/><rect x="2" y="2" width="956" height="81" rx="15" fill="url(#ambient)"/><rect x="2" y="48" width="956" height="35" rx="15" fill="url(#grid)"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><path d="M25 25L935 25" fill="none" stroke="#335b51" /><text x="32" y="58" fill="#80edb3" font-size="17" font-weight="650" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" >KEEP BUILDING. KEEP SOLVING.</text><text x="928" y="58" fill="#8cafa1" font-size="13" font-weight="400" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="end">InwooLeeme</text></g></svg>